<style>
:root{--navy:#1E3A8A;--ink:#0f172a;--slate:#475569;--line:#e2e8f0;--green:#059669;--card:rgba(255,255,255,.88);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#e8ecf1;font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
#root{height:100%}
.glass{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(15,23,42,.14)}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-36}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.7}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.dash,.pulse{animation:none}}
button:focus-visible,input:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}
</style>

 let dist=0;for(let i=1;i<pts.length;i++)dist+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
 const hints=[];ids.forEach(k=>{const h=N[k][2];if(h&&hints[hints.length-1]!==h)hints.push(h)});
 const cap=s=>s[0].toUpperCase()+s.slice(1);
 const steps=[`Depuis ${pos.name}, rejoignez l’allée la plus proche.`,...hints.map(cap).map(s=>s+"."),dest.floor?`Entrez dans ${dest.name} et montez au ${dest.floor}.`:`Vous êtes arrivé à ${dest.name}.`];
 return {pts,min:WALK(dist),steps}}

function App(){
 const [exp,setExp]=useState(window.innerWidth>=768),[pos,setPos]=useState(null),[destId,setDest]=useState(null),[q,setQ]=useState(""),[cat,setCat]=useState("all"),[placing,setPlacing]=useState(false),[sim,setSim]=useState(false),[hover,setHover]=useState(null),[toast,setToast]=useState(""),[open,setOpen]=useState(true);
 const [v,setV]=useState({x:0,y:0,k:1}),box=useRef(null),ptrs=useRef(new Map()),g=useRef({moved:0,d0:0,k0:1}),vr=useRef(v);vr.current=v;
 const dest=L.find(l=>l.id===destId),route=useMemo(()=>pos&&dest?buildRoute(pos,dest):null,[pos,destId]);
 const say=m=>{setToast(m);clearTimeout(say.t);say.t=setTimeout(()=>setToast(""),3800)};
 const fit=(pts,pad=90)=>{const r=box.current.getBoundingClientRect();const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const bw=Math.max(x1-x0,160),bh=Math.max(y1-y0,160),k=Math.min(2.6,Math.min((r.width-pad)/bw,(r.height-pad*2.4)/bh));
  setV({k,x:r.width/2-(x0+x1)/2*k,y:r.height*0.42-(y0+y1)/2*k})};
 const home=()=>{const r=box.current.getBoundingClientRect(),k=r.width<768?r.width/W*1.8:Math.min(r.width/W,r.height/H)*0.97;setV({k,x:(r.width-W*k)/2,y:(r.height-H*k)/2})};
 useEffect(()=>{home();const el=box.current;const wh=e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)};el.addEventListener("wheel",wh,{passive:false});return()=>el.removeEventListener("wheel",wh)},[]);
 useEffect(()=>{if(route&&window.innerWidth<768){setExp(false);setOpen(false)}if(route)fit(route.pts);else if(dest)fit([[dest.x,dest.y]])},[route,destId]);
 const zoomAt=(cx,cy,f)=>setV(o=>{const k=Math.min(4,Math.max(.4,o.k*f)),r=k/o.k;return{k,x:cx-(cx-o.x)*r,y:cy-(cy-o.y)*r}});
 const zoomBtn=f=>{const r=box.current.getBoundingClientRect();zoomAt(r.width/2,r.height/2,f)};
 const down=e=>{ptrs.current.set(e.pointerId,{x:e.clientX,y:e.clientY});g.current.moved=0;if(ptrs.current.size===2){const[a,b]=[...ptrs.current.values()];g.current.d0=Math.hypot(a.x-b.x,a.y-b.y);g.current.k0=vr.current.k}};
 const move=e=>{const p=ptrs.current.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.current.size===1){g.current.moved+=Math.abs(dx)+Math.abs(dy);setV(o=>({...o,x:o.x+dx,y:o.y+dy}))}
  else if(ptrs.current.size===2){g.current.moved+=20;const[a,b]=[...ptrs.current.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=box.current.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top;
   setV(o=>{const k=Math.min(4,Math.max(.4,g.current.k0*d/g.current.d0)),f=k/o.k;return{k,x:cx-(cx-o.x)*f,y:cy-(cy-o.y)*f}})}};
 const up=e=>ptrs.current.delete(e.pointerId);
 const mapClick=e=>{if(g.current.moved>6||!placing)return;const r=box.current.getBoundingClientRect(),o=vr.current;setPos({x:(e.clientX-r.left-o.x)/o.k,y:(e.clientY-r.top-o.y)/o.k,name:"le point choisi sur la carte"});setPlacing(false);say("Position définie.")};
 const pick=l=>{if(g.current.moved>6)return;if(placing){setPos({x:l.x,y:l.y,name:l.name});setPlacing(false);say("Position définie : "+l.name);return}setDest(l.id);setQ("");setOpen(true);if(window.innerWidth<768)setExp(false)};
 const setEnt=en=>{setPos({x:en.x,y:en.y,name:en.name});setSim(false);setPlacing(false)};
 const geo=()=>{if(!navigator.geolocation){say("Géolocalisation indisponible. Utilisez « Simuler ma position ».");return setSim(true)}
  say("Recherche de votre position...");navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,lo=p.coords.longitude,N_=34.0142,S=34.0110,Wl=-6.8560,El=-6.8505;
   if(la<S||la>N_||lo<Wl||lo>El){setEnt(ENT[0]);say("Vous êtes hors du campus : position simulée à l’entrée principale.")}else{setPos({x:(lo-Wl)/(El-Wl)*W,y:(N_-la)/(N_-S)*H,name:"votre position GPS"});say("Position GPS activée.")}},
   ()=>{say("Accès refusé : choisissez une position de démonstration.");setSim(true)},{enableHighAccuracy:true,timeout:8000})};
 const list=L.filter(l=>(cat==="all"||l.cat===cat)&&(!q||norm(l.name+" "+(l.note||"")).includes(norm(q))));
 const showList=!route||q;
 const Pin=({l,sel})=>{const c=CATS[l.cat][1],show=sel||hover===l.id||v.k>1.5;return html`<g transform=${`translate(${l.x} ${l.y}) scale(${(v.k<.7?.7:1)/v.k})`} style=${{cursor:"pointer"}} onPointerEnter=${()=>setHover(l.id)} onPointerLeave=${()=>setHover(null)} onClick=${e=>{e.stopPropagation();pick(l)}}>
  <circle r="22" fill="transparent"/><circle r=${sel?15:11} fill=${sel?"#dc2626":c} stroke="#fff" strokeWidth="2.5"/><circle r="3.5" fill="#fff"/>
  ${show&&html`<text y="-18" textAnchor="middle" fontSize="12.5" fontWeight="700" fill="#0f172a" stroke="#fff" strokeWidth="4" paintOrder="stroke" style=${{pointerEvents:"none"}}>${l.name}</text>`}</g>`};
 const pts=route?route.pts.map(p=>p.join(",")).join(" "):"";
 return html`<div className="relative h-full w-full select-none">
  <div ref=${box} className=${"absolute inset-0 overflow-hidden "+(placing?"cursor-crosshair":"cursor-grab")} style=${{touchAction:"none"}} onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} onClick=${mapClick}>
   <div style=${{position:"absolute",left:0,top:0,width:W,height:H,transformOrigin:"0 0",transform:`translate(${v.x}px,${v.y}px) scale(${v.k})`}}>
    <img src=${MAP} width=${W} height=${H} alt="Plan du campus" draggable="false" className="block max-w-none rounded-xl shadow-xl"/>
    <svg width=${W} height=${H} viewBox=${`0 0 ${W} ${H}`} className="absolute inset-0" style=${{overflow:"visible"}}>
     ${route&&html`<polyline points=${pts} fill="none" stroke="#fff" strokeWidth="10" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/><polyline className="dash" points=${pts} fill="none" stroke="#1E3A8A" strokeWidth="5" strokeDasharray="12 9" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>`}
     ${ENT.map(en=>html`<g key=${en.id} transform=${`translate(${en.x} ${en.y}) scale(${1/v.k})`} style=${{cursor:"pointer"}} onClick=${e=>{e.stopPropagation();if(g.current.moved<6)setEnt(en)}}>
       <rect x="-9" y="-9" width="18" height="18" rx="4" transform="rotate(45)" fill="#0f172a" stroke="#fff" strokeWidth="2.5"/>
       <text y="26" textAnchor="middle" fontSize="12" fontWeight="700" fill="#0f172a" stroke="#fff" strokeWidth="4" paintOrder="stroke" style=${{pointerEvents:"none"}}>${en.name.split(" (")[0]}</text></g>`)}
     ${L.map(l=>html`<${Pin} key=${l.id} l=${l} sel=${l.id===destId}/>`)}
     ${pos&&html`<g transform=${`translate(${pos.x} ${pos.y}) scale(${1/v.k})`} style=${{pointerEvents:"none"}}><circle className="pulse" r="14" fill="#2563eb"/><circle className="pulse" r="14" fill="#2563eb" style=${{animationDelay:".9s"}}/><circle r="9" fill="#2563eb" stroke="#fff" strokeWidth="3.5"/></g>`}
    </svg></div></div>

  <div className="glass absolute left-3 right-3 top-3 md:w-[390px] rounded-2xl p-3 flex flex-col gap-2.5 max-h-[56vh] md:max-h-[calc(100%-24px)]" style=${{top:"calc(env(safe-area-inset-top,0px) + 12px)"}}>
   <div className="flex items-center gap-2.5"><div className="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-[#1E3A8A] text-white text-sm font-bold">FS</div>
    <div className="leading-tight min-w-0"><div className="font-bold text-[15px] truncate">Faculté des Sciences de Rabat</div><div className="text-xs text-slate-500">Plan du campus et itinéraires</div></div><button aria-label="Afficher ou masquer le menu" onClick=${()=>setExp(!exp)} className="ml-auto grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-slate-200 bg-white text-slate-600"><${Ic} n="chev" c=${exp?"rotate-180":""}/></button></div>
   <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><${Ic} n="search"/></span>
    <input value=${q} onFocus=${()=>setExp(true)} onChange=${e=>setQ(e.target.value)} placeholder="Rechercher un amphi, un département..." className="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-9 text-[16px] placeholder:text-slate-400"/>
    ${q&&html`<button aria-label="Effacer" onClick=${()=>setQ("")} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400"><${Ic} n="x" s=${16}/></button>`}</div>
   ${exp&&html`<div className="flex min-h-0 flex-1 flex-col gap-2.5"><div className="flex gap-2 text-xs font-semibold items-center rounded-xl bg-slate-50 border border-slate-200 px-3 py-2">
    <span className=${"h-2.5 w-2.5 rounded-full shrink-0 "+(pos?"bg-blue-600":"bg-slate-300")}></span>
    <span className="truncate text-slate-600">${pos?"Départ : "+pos.name:"Position non définie"}</span></div>
   <div className="flex flex-wrap gap-2">
    <button onClick=${geo} className="flex items-center gap-1.5 rounded-xl bg-[#1E3A8A] px-3 py-2 text-xs font-semibold text-white hover:bg-blue-900"><${Ic} n="locate" s=${15}/>Activer ma position</button>
    <button onClick=${()=>setSim(!sim)} className="flex items-center gap-1.5 rounded-xl border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50"><${Ic} n="pin" s=${15}/>Simuler ma position</button>
    <button onClick=${()=>{setPlacing(!placing);setSim(false);if(!placing)say("Touchez la carte ou un bâtiment pour définir votre départ.")}} className=${"flex items-center gap-1.5 rounded-xl border px-3 py-2 text-xs font-semibold "+(placing?"border-emerald-600 bg-emerald-50 text-emerald-800":"border-slate-300 bg-white text-slate-700 hover:bg-slate-50")}><${Ic} n="hand" s=${15}/>Choisir sur la carte</button></div>
   ${sim&&html`<div className="grid gap-1.5">${ENT.map(en=>html`<button key=${en.id} onClick=${()=>setEnt(en)} className="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-left text-xs font-semibold text-emerald-900 hover:bg-emerald-100">${en.name}</button>`)}</div>`}
   <div className="flex gap-1.5 overflow-x-auto scroll pb-1 -mx-1 px-1">${Object.entries(CATS).map(([k,[l,c]])=>html`<button key=${k} onClick=${()=>setCat(k)} className=${"shrink-0 rounded-full border px-3 py-1.5 text-xs font-semibold transition "+(cat===k?"text-white border-transparent":"bg-white text-slate-600 border-slate-200 hover:border-slate-400")} style=${cat===k?{background:c}:{}}>${l}</button>`)}</div>
   ${showList&&html`<div className="scroll -mx-1 overflow-y-auto px-1 min-h-0 flex-1">${list.length?list.map(l=>html`<button key=${l.id} onClick=${()=>pick(l)} className=${"flex w-full items-center gap-3 rounded-xl px-2.5 py-2 text-left hover:bg-slate-100 "+(l.id===destId?"bg-blue-50":"")}>
     <span className="h-2.5 w-2.5 shrink-0 rounded-full" style=${{background:CATS[l.cat][1]}}></span><span className="min-w-0"><span className="block truncate text-sm font-semibold">${l.name}</span>${l.note&&html`<span className="block text-xs text-slate-500">${l.note}</span>`}</span></button>`):html`<div className="p-4 text-center text-sm text-slate-500">Aucun résultat. Essayez « amphi », « chimie » ou « WC ».</div>`}</div>`}
  </div>`}
  </div>

  <div className="absolute right-3 top-1/2 -translate-y-1/2 flex flex-col gap-2 md:top-auto md:bottom-16 md:translate-y-0" style=${{marginTop:0}}>
   ${[["plus",()=>zoomBtn(1.3),"Zoom avant"],["minus",()=>zoomBtn(1/1.3),"Zoom arrière"],["fit",home,"Recentrer"]].map(([n,f,t])=>html`<button key=${n} aria-label=${t} title=${t} onClick=${f} className="glass grid h-10 w-10 place-items-center rounded-xl text-slate-700 hover:text-[#1E3A8A]"><${Ic} n=${n}/></button>`)}</div>

  ${dest&&html`<div className="glass absolute bottom-3 left-3 right-3 md:left-auto md:right-16 md:w-[430px] rounded-2xl p-4 max-h-[46vh] flex flex-col" style=${{bottom:"calc(env(safe-area-inset-bottom,0px) + 12px)"}}>
   <div className="flex items-start gap-3"><div className="min-w-0 flex-1"><div className="text-xs font-semibold text-emerald-700">Destination</div><div className="text-base font-bold leading-snug">${dest.name}</div>
    ${(dest.floor||dest.note)&&html`<div className="text-xs text-slate-500">${dest.floor?dest.floor+(dest.note?" : "+dest.note:""):dest.note}</div>`}</div>
    ${route&&html`<div className="flex shrink-0 items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1.5 text-xs font-bold text-emerald-800"><${Ic} n="clock" s=${14}/>~${route.min} min à pied</div>`}</div>
   ${route?html`<button onClick=${()=>setOpen(!open)} className="mt-2 flex items-center gap-1 text-xs font-semibold text-[#1E3A8A]">${open?"Masquer":"Afficher"} les indications<${Ic} n="chev" s=${14} c=${open?"rotate-180":""}/></button>
    ${open&&html`<ol className="scroll mt-2 min-h-0 flex-1 space-y-2 overflow-y-auto pr-1">${route.steps.map((s,i)=>html`<li key=${i} className="flex gap-2.5 text-sm text-slate-700"><span className="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-full bg-[#1E3A8A] text-[11px] font-bold text-white">${i+1}</span>${s}</li>`)}</ol>`}`
    :html`<div className="mt-2 flex flex-wrap gap-2"><p className="w-full text-sm text-slate-600">Où êtes-vous ? Choisissez votre départ :</p><button onClick=${geo} className="flex items-center gap-1.5 rounded-xl bg-[#1E3A8A] px-3 py-2.5 text-xs font-semibold text-white"><${Ic} n="locate" s=${15}/>Activer ma position</button>${ENT.map(en=>html`<button key=${en.id} onClick=${()=>setEnt(en)} className="rounded-xl border border-emerald-300 bg-emerald-50 px-3 py-2.5 text-xs font-semibold text-emerald-900">${en.name.split(" (")[0]}</button>`)}</div>`}
   <button onClick=${()=>{setDest(null);home()}} className="mt-3 flex items-center justify-center gap-1.5 rounded-xl border border-slate-300 bg-white py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"><${Ic} n="x" s=${15}/>Terminer l’itinéraire</button></div>`}

  ${toast&&html`<div role="status" className="absolute left-1/2 -translate-x-1/2 rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white shadow-lg max-w-[90%] text-center" style=${{bottom:dest?"calc(50vh + 8px)":"60px"}}>${toast}</div>`}
  <div className="absolute bottom-1.5 left-3 hidden text-[11px] text-slate-500 md:block" style=${{marginBottom:"env(safe-area-inset-bottom,0px)"}}>Conçu par Jihad Tichti, Université Mohammed V de Rabat</div>
 </div>`}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
